<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P Крестики-Нолики</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; background: #f0f2f5; padding: 20px; }
        h1 { margin-bottom: 15px; text-align: center; color: #1a1a1a; }
        .game-card { background: white; padding: 25px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); width: 100%; max-width: 360px; text-align: center; }
        #status { font-size: 18px; font-weight: bold; margin-bottom: 15px; color: #555; }
        .btn-invite { background: #007bff; color: white; border: none; padding: 12px 20px; font-size: 15px; border-radius: 10px; cursor: pointer; width: 100%; margin-bottom: 15px; font-weight: bold; transition: background 0.2s; }
        .btn-invite:hover { background: #0056b3; }
        #board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 300px; height: 300px; margin: 0 auto; }
        .cell { background: #f8f9fa; border: 2px solid #e9ecef; border-radius: 12px; font-size: 48px; font-weight: bold; display: flex; align-items: center; justify-content: center; cursor: pointer; user-select: none; color: #333; }
        .cell:hover { background: #e9ecef; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <h1>❌⭕ Крестики-Нолики</h1>

    <div class="game-card">
        <div id="status">Загрузка сети...</div>
        
        <button id="invite-btn" class="btn-invite hidden" onclick="copyLink()">🔗 Пригласить друга</button>

        <div id="board">
            <div class="cell" onclick="makeMove(0)"></div>
            <div class="cell" onclick="makeMove(1)"></div>
            <div class="cell" onclick="makeMove(2)"></div>
            <div class="cell" onclick="makeMove(3)"></div>
            <div class="cell" onclick="makeMove(4)"></div>
            <div class="cell" onclick="makeMove(5)"></div>
            <div class="cell" onclick="makeMove(6)"></div>
            <div class="cell" onclick="makeMove(7)"></div>
            <div class="cell" onclick="makeMove(8)"></div>
        </div>
    </div>

    <script>
        const peer = new Peer();
        let conn = null;
        let mySymbol = '';
        let currentTurn = 'X';
        let boardState = Array(9).fill(null);

        const urlParams = new URLSearchParams(window.location.search);
        const targetPeerId = urlParams.get('room');

        peer.on('open', (id) => {
            if (targetPeerId) {
                // Мы — ГОСТЬ
                mySymbol = 'O';
                document.getElementById('status').innerText = 'Подключение к хосту...';
                connectToHost(targetPeerId);
            } else {
                // Мы — ХОСТ
                mySymbol = 'X';
                document.getElementById('status').innerText = 'Ожидание соперника...';
                document.getElementById('invite-btn').classList.remove('hidden');
            }
        });

        // Слушаем входящие подключения (для ХОСТА)
        peer.on('connection', (c) => {
            conn = c;
            bindEvents();
        });

        // Функция подключения (для ГОСТЯ)
        function connectToHost(hostId) {
            conn = peer.connect(hostId, { reliable: true });
            bindEvents();
        }

        // Единая подвязка событий для обоих
        function bindEvents() {
            conn.on('open', () => {
                document.getElementById('invite-btn').classList.add('hidden');
                updateStatus();
            });

            conn.on('data', (data) => {
                if (data.type === 'move') {
                    boardState[data.index] = data.symbol;
                    currentTurn = mySymbol;
                    renderBoard();
                    checkWinner();
                    updateStatus();
                }
            });

            // Если соединение уже оказалось открытым (быстрая инициализация)
            if (conn.open) {
                document.getElementById('invite-btn').classList.add('hidden');
                updateStatus();
            }
        }

        function copyLink() {
            const link = `${window.location.origin}${window.location.pathname}?room=${peer.id}`;
            navigator.clipboard.writeText(link);
            alert('Ссылка скопирована! Отправь её другу.');
        }

        function makeMove(index) {
            if (boardState[index] || currentTurn !== mySymbol || !conn || !conn.open) return;

            boardState[index] = mySymbol;
            conn.send({ type: 'move', index: index, symbol: mySymbol });
            currentTurn = mySymbol === 'X' ? 'O' : 'X';
            renderBoard();
            checkWinner();
            updateStatus();
        }

        function renderBoard() {
            const cells = document.querySelectorAll('.cell');
            cells.forEach((cell, i) => {
                cell.innerText = boardState[i] || '';
            });
        }

        function updateStatus() {
            const statusEl = document.getElementById('status');
            if (currentTurn === mySymbol) {
                statusEl.innerText = `Ваш ход (${mySymbol})`;
                statusEl.style.color = '#007bff';
            } else {
                statusEl.innerText = `Ход соперника (${currentTurn === 'X' ? 'O' : 'X'})...`;
                statusEl.style.color = '#666';
            }
        }

        function checkWinner() {
            const wins = [
                [0,1,2], [3,4,5], [6,7,8],
                [0,3,6], [1,4,7], [2,5,8],
                [0,4,8], [2,4,6]
            ];
            for (let w of wins) {
                if (boardState[w[0]] && boardState[w[0]] === boardState[w[1]] && boardState[w[0]] === boardState[w[2]]) {
                    const winner = boardState[w[0]];
                    alert(winner === mySymbol ? 'Победа! 🎉' : 'Поражение! 😞');
                    location.reload();
                    return;
                }
            }
            if (!boardState.includes(null)) {
                alert('Ничья! 🤝');
                location.reload();
            }
        }
    </script>
</body>
</html>
