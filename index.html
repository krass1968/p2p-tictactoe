<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Крестики-Нолики v1.1</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; background: #f0f2f5; padding: 20px; }
        h1 { margin-bottom: 5px; text-align: center; color: #1a1a1a; }
        .version { font-size: 13px; color: #888; margin-bottom: 15px; font-weight: normal; }
        .game-card { background: white; padding: 25px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); width: 100%; max-width: 360px; text-align: center; }
        #status { font-size: 16px; font-weight: bold; margin-bottom: 15px; color: #555; }
        .btn-invite { background: #007bff; color: white; border: none; padding: 12px 20px; font-size: 15px; border-radius: 10px; cursor: pointer; width: 100%; margin-bottom: 15px; font-weight: bold; }
        .btn-invite:hover { background: #0056b3; }
        #board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 300px; height: 300px; margin: 0 auto; }
        .cell { background: #f8f9fa; border: 2px solid #e9ecef; border-radius: 12px; font-size: 48px; font-weight: bold; display: flex; align-items: center; justify-content: center; cursor: pointer; user-select: none; color: #333; }
        .cell:hover { background: #e9ecef; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <h1>❌⭕ Крестики-Нолики <span class="version">v1.1</span></h1>

    <div class="game-card">
        <div id="status">Подключение...</div>
        
        <button id="invite-btn" class="btn-invite hidden" onclick="copyLink()">🔗 Пригласить друга</button>

        <div id="board">
            <div class="cell" onclick="makeMove(0)"></div>
            <div class="cell" onclick="makeMove(1)"></div>
            <div class="cell" onclick="makeMove(2)"></div>
            <div class="cell" onclick="makeMove(3)"></div>
            <div class="cell" onclick="makeMove(4)"></div>
            <div class="cell" onclick="makeMove(5)"></div>
            <div class="cell" onclick="makeMove(6)"></div>
            <div class="cell" onclick="makeMove(7)"></div>
            <div class="cell" onclick="makeMove(8)"></div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let roomId = urlParams.get('room');
        const isHost = !roomId;

        if (isHost) {
            roomId = Math.random().toString(36).substring(2, 9);
        }

        const mySymbol = isHost ? 'X' : 'O';
        let currentTurn = 'X';
        let boardState = Array(9).fill(null);
        let gameReady = false;

        // Общественный быстрый WebSocket от PieSocket
        const apiKey = 'demo';
        const socket = new WebSocket(`wss://demo.piesocket.com/v3/${roomId}?api_key=${apiKey}&notify_self=0`);

        socket.onopen = () => {
            if (isHost) {
                document.getElementById('status').innerText = 'Ожидание соперника...';
                document.getElementById('invite-btn').classList.remove('hidden');
            } else {
                // Гость вошел и кричит хосту: "Я тут!"
                sendSignal({ type: 'join' });
            }
        };

        socket.onmessage = (event) => {
            const data = JSON.parse(event.data);

            if (data.type === 'join' && isHost) {
                gameReady = true;
                document.getElementById('invite-btn').classList.add('hidden');
                sendSignal({ type: 'start' });
                updateStatus();
            }

            if (data.type === 'start' && !isHost) {
                gameReady = true;
                document.getElementById('invite-btn').classList.add('hidden');
                updateStatus();
            }

            if (data.type === 'move') {
                boardState[data.index] = data.symbol;
                currentTurn = data.symbol === 'X' ? 'O' : 'X';
                renderBoard();
                checkWinner();
                updateStatus();
            }
        };

        function sendSignal(msg) {
            if (socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify(msg));
            }
        }

        function copyLink() {
            const link = `${window.location.origin}${window.location.pathname}?room=${roomId}`;
            navigator.clipboard.writeText(link);
            alert('Ссылка v1.1 скопирована!');
        }

        function makeMove(index) {
            if (!gameReady || boardState[index] || currentTurn !== mySymbol) return;

            boardState[index] = mySymbol;
            currentTurn = mySymbol === 'X' ? 'O' : 'X';
            renderBoard();
            checkWinner();
            updateStatus();

            sendSignal({
                type: 'move',
                index: index,
                symbol: mySymbol
            });
        }

        function renderBoard() {
            const cells = document.querySelectorAll('.cell');
            cells.forEach((cell, i) => {
                cell.innerText = boardState[i] || '';
            });
        }

        function updateStatus() {
            const statusEl = document.getElementById('status');
            if (currentTurn === mySymbol) {
                statusEl.innerText = `Ваш ход (${mySymbol})`;
                statusEl.style.color = '#007bff';
            } else {
                statusEl.innerText = `Ход соперника (${currentTurn})...`;
                statusEl.style.color = '#666';
            }
        }

        function checkWinner() {
            const wins = [
                [0,1,2], [3,4,5], [6,7,8],
                [0,3,6], [1,4,7], [2,5,8],
                [0,4,8], [2,4,6]
            ];
            for (let w of wins) {
                if (boardState[w[0]] && boardState[w[0]] === boardState[w[1]] && boardState[w[0]] === boardState[w[2]]) {
                    const winner = boardState[w[0]];
                    setTimeout(() => {
                        alert(winner === mySymbol ? 'Победа! 🎉' : 'Поражение! 😞');
                        location.href = window.location.pathname;
                    }, 100);
                    return;
                }
            }
            if (!boardState.includes(null)) {
                setTimeout(() => {
                    alert('Ничья! 🤝');
                    location.href = window.location.pathname;
                }, 100);
            }
        }
    </script>
</body>
</html>
