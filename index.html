<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Запрет кэширования: браузер больше не будет просить Ctrl+F5 -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <title>Крестики-Нолики v2.4</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
        }

        body { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            background: #f0f2f5; 
            padding: 20px; 
        }
        
        /* Кнопка приглашения НАД игрой */
        .btn-invite { 
            background: #007bff; 
            color: white; 
            border: none; 
            padding: 14px 20px; 
            font-size: 16px; 
            border-radius: 12px; 
            cursor: pointer; 
            width: 100%; 
            max-width: 360px; 
            margin-bottom: 20px; 
            font-weight: bold; 
            box-shadow: 0 4px 12px rgba(0, 123, 255, 0.25); 
            transition: all 0.2s ease; 
        }
        
        .btn-invite:hover { 
            background: #0056b3; 
            transform: translateY(-1px);
        }

        /* Зеленый статус подключения соперника */
        .btn-connected { 
            background: #28a745 !important; 
            cursor: default; 
            box-shadow: 0 4px 12px rgba(40, 167, 69, 0.25);
            transform: none !important;
        }

        h1 { 
            margin-bottom: 5px; 
            text-align: center; 
            color: #1a1a1a; 
        }

        .version { 
            font-size: 13px; 
            color: #888; 
            margin-bottom: 15px; 
            font-weight: normal; 
        }
        
        .game-card { 
            background: white; 
            padding: 25px; 
            border-radius: 16px; 
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08); 
            width: 100%; 
            max-width: 360px; 
            text-align: center; 
        }

        #status { 
            font-size: 16px; 
            font-weight: bold; 
            margin-bottom: 15px; 
            color: #555; 
        }
        
        #board { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 10px; 
            width: 100%; 
            margin: 0 auto; 
        }

        .cell { 
            background: #f8f9fa; 
            border: 2px solid #e9ecef; 
            border-radius: 12px; 
            font-size: 44px; 
            font-weight: bold; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            cursor: pointer; 
            user-select: none; 
            color: #333; 
            aspect-ratio: 1; 
            transition: background 0.12s, border-color 0.12s; 
        }

        .cell:hover { 
            background: #e9ecef; 
        }

        .hidden { 
            display: none !important; 
        }
    </style>
</head>
<body>

    <!-- Кнопка сверху над игрой -->
    <button id="invite-btn" class="btn-invite hidden" onclick="copyLink()">🔗 Пригласить друга</button>

    <h1>❌⭕ Крестики-Нолики <span class="version">v2.4</span></h1>

    <div class="game-card">
        <div id="status">Загрузка...</div>

        <div id="board">
            <div class="cell" onclick="makeMove(0)"></div>
            <div class="cell" onclick="makeMove(1)"></div>
            <div class="cell" onclick="makeMove(2)"></div>
            <div class="cell" onclick="makeMove(3)"></div>
            <div class="cell" onclick="makeMove(4)"></div>
            <div class="cell" onclick="makeMove(5)"></div>
            <div class="cell" onclick="makeMove(6)"></div>
            <div class="cell" onclick="makeMove(7)"></div>
            <div class="cell" onclick="makeMove(8)"></div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let roomId = urlParams.get('room');
        const isHost = !roomId;

        if (isHost) {
            roomId = Math.random().toString(36).substring(2, 9);
        }

        const mySymbol = isHost ? 'X' : 'O';
        let currentTurn = 'X';
        let boardState = Array(9).fill(null);

        const statusEl = document.getElementById('status');
        const inviteBtn = document.getElementById('invite-btn');

        if (isHost) {
            inviteBtn.classList.remove('hidden');
        }
        updateStatus();

        const client = window.supabase.createClient(
            'https://dmyudoxgljhfgasvvuvd.supabase.co', 
            'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRteXVkb3hnbGpoZmdhc3Z2dXZkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MzgxOTgwMTUsImV4cCI6MjA1Mzc3NDAxNX0.zV_7-B9J1pB3Z-aE5X9eO1d4lM8C6F2G1H0I3J4K5L6'
        );
        
        const channel = client.channel(`room_${roomId}`, {
            config: { broadcast: { self: false } }
        });

        channel
            .on('broadcast', { event: 'game' }, (payload) => {
                const data = payload?.payload ?? payload;

                // 1. Соперник зашел: Хост меняет кнопку на ЗЕЛЕНУЮ "🟢 Соперник в игре"
                if (data.type === 'ping' && isHost) {
                    setOpponentConnected();
                    // Синхронизируем состояние доски для вошедшего соперника
                    channel.send({
                        type: 'broadcast',
                        event: 'game',
                        payload: { type: 'sync', boardState: boardState, currentTurn: currentTurn }
                    });
                }

                // 2. Прием синхронизации гостем
                if (data.type === 'sync' && !isHost) {
                    boardState = data.boardState;
                    currentTurn = data.currentTurn;
                    renderBoard();
                    updateStatus();
                }

                // 3. Прием хода
                if (data.type === 'move') {
                    if (isHost) setOpponentConnected();
                    boardState[data.index] = data.symbol;
                    currentTurn = data.symbol === 'X' ? 'O' : 'X';
                    renderBoard();
                    checkWinner();
                    updateStatus();
                }
            })
            .subscribe((status) => {
                if (status === 'SUBSCRIBED' && !isHost) {
                    // Гость сообщает хосту, что он зашел
                    channel.send({ type: 'broadcast', event: 'game', payload: { type: 'ping' } });
                }
            });

        function setOpponentConnected() {
            inviteBtn.innerText = '🟢 Соперник в игре';
            inviteBtn.classList.add('btn-connected');
            inviteBtn.onclick = null;
        }

        function copyLink() {
            const link = `${window.location.origin}${window.location.pathname}?room=${roomId}`;
            navigator.clipboard.writeText(link);
            alert('Ссылка скопирована!');
        }

        function makeMove(index) {
            if (boardState[index] || currentTurn !== mySymbol) return;

            boardState[index] = mySymbol;
            currentTurn = mySymbol === 'X' ? 'O' : 'X';
            renderBoard();
            checkWinner();
            updateStatus();

            channel.send({
                type: 'broadcast',
                event: 'game',
                payload: { type: 'move', index: index, symbol: mySymbol }
            });
        }

        function renderBoard() {
            const cells = document.querySelectorAll('.cell');
            cells.forEach((cell, i) => {
                cell.innerText = boardState[i] || '';
            });
        }

        function updateStatus() {
            if (currentTurn === mySymbol) {
                statusEl.innerText = `Ваш ход (${mySymbol})`;
                statusEl.style.color = '#007bff';
            } else {
                statusEl.innerText = `Ход соперника (${currentTurn})...`;
                statusEl.style.color = '#666';
            }
        }

        function checkWinner() {
            const wins = [
                [0,1,2], [3,4,5], [6,7,8],
                [0,3,6], [1,4,7], [2,5,8],
                [0,4,8], [2,4,6]
            ];
            for (let w of wins) {
                if (boardState[w[0]] && boardState[w[0]] === boardState[w[1]] && boardState[w[0]] === boardState[w[2]]) {
                    const winner = boardState[w[0]];
                    setTimeout(() => {
                        alert(winner === mySymbol ? 'Победа! 🎉' : 'Поражение! 😞');
                        resetGame();
                    }, 100);
                    return;
                }
            }
            if (!boardState.includes(null)) {
                setTimeout(() => {
                    alert('Ничья! 🤝');
                    resetGame();
                }, 100);
            }
        }

        function resetGame() {
            if (isHost) {
                location.href = window.location.pathname;
            } else {
                location.href = `${window.location.pathname}?room=${roomId}`;
            }
        }
    </script>
</body>
</html>
