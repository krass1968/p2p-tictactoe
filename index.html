<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Крестики-Нолики v2.2</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; background: #f0f2f5; padding: 20px; }
        h1 { margin-bottom: 5px; text-align: center; color: #1a1a1a; }
        .version { font-size: 13px; color: #888; margin-bottom: 15px; font-weight: normal; }
        .game-card { background: white; padding: 25px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); width: 100%; max-width: 360px; text-align: center; }
        #status { font-size: 15px; font-weight: bold; margin-bottom: 15px; color: #555; }
        .btn-invite { background: #007bff; color: white; border: none; padding: 12px 20px; font-size: 15px; border-radius: 10px; cursor: pointer; width: 100%; margin-bottom: 15px; font-weight: bold; }
        .btn-invite:hover { background: #0056b3; }
        #board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; margin: 0 auto; }
        .cell { background: #f8f9fa; border: 2px solid #e9ecef; border-radius: 12px; font-size: 44px; font-weight: bold; display: flex; align-items: center; justify-content: center; cursor: pointer; user-select: none; color: #333; aspect-ratio: 1; }
        .cell:hover { background: #e9ecef; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <h1>❌⭕ Крестики-Нолики <span class="version">v2.2</span></h1>

    <div class="game-card">
        <div id="status">Инициализация...</div>
        
        <button id="invite-btn" class="btn-invite hidden" onclick="copyLink()">🔗 Пригласить друга</button>

        <div id="board">
            <div class="cell" onclick="makeMove(0)"></div>
            <div class="cell" onclick="makeMove(1)"></div>
            <div class="cell" onclick="makeMove(2)"></div>
            <div class="cell" onclick="makeMove(3)"></div>
            <div class="cell" onclick="makeMove(4)"></div>
            <div class="cell" onclick="makeMove(5)"></div>
            <div class="cell" onclick="makeMove(6)"></div>
            <div class="cell" onclick="makeMove(7)"></div>
            <div class="cell" onclick="makeMove(8)"></div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let roomId = urlParams.get('room');
        const isHost = !roomId;

        if (isHost) {
            roomId = Math.random().toString(36).substring(2, 9);
        }

        const mySymbol = isHost ? 'X' : 'O';
        let currentTurn = 'X';
        let boardState = Array(9).fill(null);

        // Старый простой статус
        const statusEl = document.getElementById('status');
        const inviteBtn = document.getElementById('invite-btn');

        if (isHost) {
            statusEl.innerText = 'Ожидание соперника (Ход X)';
            inviteBtn.classList.remove('hidden');
        } else {
            statusEl.innerText = 'Игра началась! (Ход X)';
        }

        const client = window.supabase.createClient(
            'https://dmyudoxgljhfgasvvuvd.supabase.co', 
            'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRteXVkb3hnbGpoZmdhc3Z2dXZkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MzgxOTgwMTUsImV4cCI6MjA1Mzc3NDAxNX0.zV_7-B9J1pB3Z-aE5X9eO1d4lM8C6F2G1H0I3J4K5L6'
        );
        
        const channel = client.channel(`room_${roomId}`, {
            config: { broadcast: { self: false } }
        });

        // Прямой прием ходов без сложных проверок готовности
        channel
            .on('broadcast', { event: 'game' }, (payload) => {
                const data = payload?.payload ?? payload;

                if (data.type === 'move') {
                    boardState[data.index] = data.symbol;
                    currentTurn = data.symbol === 'X' ? 'O' : 'X';
                    renderBoard();
                    checkWinner();
                    updateStatus();
                }
            })
            .subscribe();

        function copyLink() {
            const link = `${window.location.origin}${window.location.pathname}?room=${roomId}`;
            navigator.clipboard.writeText(link);
            alert('Ссылка скопирована!');
        }

        function makeMove(index) {
            // Простая проверка: если клетка занята или сейчас не твой ход — игнор
            if (boardState[index] || currentTurn !== mySymbol) return;

            boardState[index] = mySymbol;
            currentTurn = mySymbol === 'X' ? 'O' : 'X';
            renderBoard();
            checkWinner();
            updateStatus();

            // Просто отправляем ход в канал
            channel.send({
                type: 'broadcast',
                event: 'game',
                payload: { type: 'move', index: index, symbol: mySymbol }
            });
        }

        function renderBoard() {
            const cells = document.querySelectorAll('.cell');
            cells.forEach((cell, i) => {
                cell.innerText = boardState[i] || '';
            });
        }

        function updateStatus() {
            if (currentTurn === mySymbol) {
                statusEl.innerText = `Ваш ход (${mySymbol})`;
                statusEl.style.color = '#007bff';
            } else {
                statusEl.innerText = `Ход соперника (${currentTurn})...`;
                statusEl.style.color = '#666';
            }
        }

        function checkWinner() {
            const wins = [
                [0,1,2], [3,4,5], [6,7,8],
                [0,3,6], [1,4,7], [2,5,8],
                [0,4,8], [2,4,6]
            ];
            for (let w of wins) {
                if (boardState[w[0]] && boardState[w[0]] === boardState[w[1]] && boardState[w[0]] === boardState[w[2]]) {
                    const winner = boardState[w[0]];
                    setTimeout(() => {
                        alert(winner === mySymbol ? 'Победа! 🎉' : 'Поражение! 😞');
                        resetGame();
                    }, 100);
                    return;
                }
            }
            if (!boardState.includes(null)) {
                setTimeout(() => {
                    alert('Ничья! 🤝');
                    resetGame();
                }, 100);
            }
        }

        function resetGame() {
            if (isHost) {
                location.href = window.location.pathname; // Создает новую комнату для Хоста
            } else {
                location.href = `${window.location.pathname}?room=${roomId}`;
            }
        }
    </script>
</body>
</html>
